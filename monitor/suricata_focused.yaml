# Focused Suricata Configuration for XSS Attack Detection
# Optimized for ML training with minimal event types

%YAML 1.1
---

# Global stats - reduced interval for focused monitoring
stats:
  enabled: yes
  interval: 30

# Configure outputs for XSS-focused ML analysis
outputs:
  # Focused eve.json output with only HTTP and Alert events
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /captures/eve_focused.json
      pcap-file: false
      community-id: false
      community-id-seed: 0
      xff:
        enabled: no

      types:
        # Only log alerts for security events
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            http-body: yes
            http-body-printable: yes
            metadata: yes
            tagged-packets: yes
            
        # Only log HTTP for web traffic analysis
        - http:
            extended: yes
            dump-all-headers: yes

  # Fast log for quick alert viewing
  - fast:
      enabled: yes
      filename: /captures/fast_focused.log
      append: yes

  # Minimal stats for monitoring
  - stats:
      enabled: yes
      filename: /captures/stats_focused.log
      append: yes
      totals: yes
      threads: no

# Focused logging - only errors and important events
logging:
  default-log-level: error
  outputs:
  - file:
      enabled: yes
      level: error
      filename: /captures/suricata_focused.log

# Network interface configuration
af-packet:
  - interface: eth0
    cluster-id: 100
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

# Detection engine - optimized for HTTP/XSS detection
detect-engine:
  - profile: high
  - custom-values:
      toclient-groups: 2
      toserver-groups: 10
  - sgh-mpm-context: auto
  - inspection-recursion-limit: 2000

# Threading - minimal for focused monitoring
threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [ 0 ]
    - receive-cpu-set:
        cpu: [ 0 ]
    - worker-cpu-set:
        cpu: [ "all" ]
  detect-thread-ratio: 1.0

# App layer protocols - only HTTP and TLS for web traffic
app-layer:
  protocols:
    http:
      enabled: yes
      memcap: 64mb
      default-config:
        personality: IDS
        request-body-limit: 100kb
        response-body-limit: 100kb
        request-body-minimal-inspect-size: 32kb
        request-body-inspect-window: 4kb
        response-body-minimal-inspect-size: 40kb
        response-body-inspect-window: 16kb
        http-body-inline: auto
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    # Disable other protocols to reduce noise
    smtp:
      enabled: no
    ssh:
      enabled: no
    dns:
      tcp:
        enabled: no
      udp:
        enabled: no

# Rule engine - XSS focused rules
default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules

# Security classification
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

# Variables
vars:
  address-groups:
    HOME_NET: "[100.64.0.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    
  port-groups:
    HTTP_PORTS: "[80,3000,8080,8000]"
    HTTPS_PORTS: "443"

# Host OS policy
host-os-policy:
  linux: [100.64.0.0/24, "::1"]

# Exception policy
exception-policy: auto

# Disable unnecessary features for focused monitoring
coredump:
  max-dump: 0

# Capture settings
capture:
  disable-offloading: yes

# PCAP processing
pcap:
  - interface: default

# Run mode
runmode: autofp

# Engine analysis - minimal for performance
engine-analysis:
  rules-fast-pattern: yes
  rules: yes

# Performance tuning for focused monitoring
max-pending-packets: 1024
default-packet-size: 1518

# Disable profiling for better performance
profiling:
  rules:
    enabled: no
  keywords:
    enabled: no
  prefilter:
    enabled: no
  rulegroups:
    enabled: no
  packets:
    enabled: no
